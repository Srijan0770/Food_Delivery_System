{% extends 'base.html' %}
{% block title %}{{ title }} - FoodExpress{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-4"><i class="bi bi-shop me-2 text-danger"></i>{{ title }}</h4>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row g-3">
                            {% for field in form %}
                            <div class="col-md-{% if field.name == 'description' or field.name == 'address' %}12{% else %}6{% endif %}">
                                <label class="form-label fw-semibold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                                {% endif %}
                            </div>
                            {% endfor %}
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">Save</button>
                            <a href="{% url 'my_restaurant' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
